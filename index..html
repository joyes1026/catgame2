<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛球日記｜養寵物遊戲</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(#bde6ff 0 65%,#b9df91 65%);color:#39454a;overflow-x:hidden}.game{width:min(920px,94%);margin:auto;padding:25px 0}.top{display:flex;justify-content:space-between;align-items:center;background:#fff9;padding:15px 20px;border:2px solid #fff;border-radius:22px;backdrop-filter:blur(8px)}h1{font-size:24px;margin:0}.coins{background:#fff3b4;padding:9px 16px;border-radius:20px;font-weight:bold}.room{height:420px;margin:18px 0;position:relative;background:linear-gradient(#eaf7ff 0 72%,#e7cda5 72%);border:5px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px #48687625}.window{position:absolute;left:35px;top:35px;width:150px;height:120px;background:#82cdf2;border:10px solid #fff;border-radius:14px}.window:before,.window:after{content:"";position:absolute;background:white}.window:before{width:5px;height:100%;left:50%}.window:after{height:5px;width:100%;top:50%}.cloud{position:absolute;left:20px;top:23px;font-size:38px;animation:cloud 7s linear infinite}.plant{position:absolute;right:40px;bottom:65px;font-size:80px}.bed{position:absolute;right:130px;bottom:55px;font-size:90px}.pet-wrap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);text-align:center}.name{display:inline-block;background:white;padding:5px 16px;border-radius:20px;margin-bottom:8px;font-weight:bold}.pet{font-size:150px;line-height:1;filter:drop-shadow(0 12px 8px #0002);transform-origin:bottom;cursor:pointer;user-select:none}.outfit{position:absolute;z-index:3;left:50%;top:37px;transform:translateX(-50%);font-size:55px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 2px #0002)}.pet.happy{animation:jump .45s 2}.pet.sleeping{animation:breathe 2s infinite}.bubble{position:absolute;left:50%;top:-20px;transform:translateX(-50%);background:white;padding:10px 15px;border-radius:18px;white-space:nowrap;opacity:0;transition:.3s;box-shadow:0 5px 15px #0002}.bubble.show{opacity:1;top:-35px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:14px;border-radius:18px;box-shadow:0 6px 15px #49606d15}.stat-head{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-bottom:8px}.bar{height:13px;background:#e8edf0;border-radius:10px;overflow:hidden}.fill{height:100%;border-radius:10px;transition:width .5s}.food{background:#ff9f68}.mood{background:#ffcf5a}.clean{background:#69c9d0}.energy{background:#8c86df}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.action{border:0;border-bottom:5px solid #c8d4da;background:white;border-radius:18px;padding:15px 8px;font-size:16px;font-weight:bold;color:#46545a;cursor:pointer;transition:.15s}.action span{display:block;font-size:30px;margin-bottom:5px}.action:hover{transform:translateY(-3px)}.action:active{transform:translateY(3px);border-bottom-width:2px}.extra-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.extra{border:0;border-bottom:5px solid #d99d4a;border-radius:18px;padding:14px;background:#fff3b4;color:#674c26;font-size:17px;font-weight:bold;cursor:pointer}.extra.shop{background:#ffd8ed;border-bottom-color:#d88aac}.message{text-align:center;min-height:28px;margin:15px 0 0;font-weight:bold}.reset{display:block;margin:10px auto;border:0;background:none;color:#58727d;text-decoration:underline;cursor:pointer}.modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:#23343b99}.modal.open{display:grid}.panel{position:relative;width:min(560px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 50px #0004}.panel h2{margin:0 40px 8px 0}.close{position:absolute;right:16px;top:14px;border:0;background:#eef2f3;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}.game-info{display:flex;justify-content:space-between;margin:12px 0;font-weight:bold}.game-area{height:300px;position:relative;overflow:hidden;border:4px dashed #ffd25b;border-radius:20px;background:linear-gradient(#c9ecff,#effbdc)}.catch-coin{position:absolute;width:58px;height:58px;border:0;border-radius:50%;background:#ffcd3c;font-size:31px;cursor:pointer;box-shadow:0 5px 0 #d99c16;transition:left .12s,top .12s}.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-height:420px;overflow:auto;margin-top:15px}.shop-item{border:2px solid #f1d9e5;border-radius:18px;padding:14px;text-align:center;background:#fff8fc}.shop-icon{font-size:50px;height:60px}.shop-item h3{font-size:15px;margin:5px}.shop-item button{width:100%;border:0;border-radius:12px;padding:9px;background:#ef86b8;color:white;font-weight:bold;cursor:pointer}.shop-item button:disabled{background:#aab7bc;cursor:default}.spark{position:absolute;font-size:28px;animation:spark 1s forwards;pointer-events:none}@keyframes jump{50%{transform:translateY(-35px) rotate(5deg)}}@keyframes breathe{50%{transform:scale(1.04)}}@keyframes cloud{50%{transform:translateX(50px)}}@keyframes spark{to{transform:translateY(-80px) scale(1.5);opacity:0}}@media(max-width:650px){h1{font-size:19px}.room{height:360px}.pet{font-size:120px}.outfit{top:37px;font-size:44px}.window{width:110px;height:90px}.plant{font-size:55px;right:15px}.bed{display:none}.stats,.actions{grid-template-columns:repeat(2,1fr)}.game-area{height:260px}.shop-grid{grid-template-columns:1fr}}
  </style>
  <style>
    /* 新功能：左耳飾品、成長與兩種新遊戲 */
    .pet-wrap{--growth:1;transform:translateX(-50%) scale(var(--growth));transform-origin:center bottom;transition:transform .6s}
    .outfit{left:29%;top:45px;font-size:42px}
    .extra-actions{grid-template-columns:repeat(4,1fr)}
    .extra.guess{background:#dff7ce;border-bottom-color:#83b766}
    .extra.reaction{background:#dcecff;border-bottom-color:#7ca5d4}
    .choice-area{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:25px 0}
    .choice-btn,.reaction-btn{border:0;border-radius:18px;padding:18px 25px;background:#78c96b;color:white;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #4d9b43}
    .reaction-zone{height:260px;display:grid;place-items:center;border-radius:20px;background:#edf2f5;margin-top:18px}
    .reaction-btn{width:190px;height:100px;background:#9da9af;box-shadow:0 6px 0 #788489}
    .reaction-btn.ready{background:#65c96b;box-shadow:0 6px 0 #3d9845}
    .result-note{text-align:center;min-height:28px;font-weight:bold}
    @media(max-width:700px){.extra-actions{grid-template-columns:repeat(2,1fr)}.outfit{left:29%;top:43px;font-size:36px}}
  </style>
</head>
<body>
  <main class="game">
    <header class="top"><h1>🐾 毛球日記</h1><div class="coins">🪙 <span id="coins">20</span></div></header>
    <section class="room" id="room">
      <div class="window"><span class="cloud">☁️</span></div><div class="plant">🪴</div><div class="bed">🧺</div>
      <div class="pet-wrap"><div class="bubble" id="bubble">主人，你來啦！</div><div class="name" id="petName">麻糬 Lv.1</div><div class="outfit" id="outfit"></div><div class="pet" id="pet">🐱</div></div>
    </section>
    <section class="stats">
      <div class="stat"><div class="stat-head"><span>🍗 飽食</span><b id="foodText">80</b></div><div class="bar"><div class="fill food" id="foodBar"></div></div></div>
      <div class="stat"><div class="stat-head"><span>💛 心情</span><b id="moodText">80</b></div><div class="bar"><div class="fill mood" id="moodBar"></div></div></div>
      <div class="stat"><div class="stat-head"><span>🫧 清潔</span><b id="cleanText">80</b></div><div class="bar"><div class="fill clean" id="cleanBar"></div></div></div>
      <div class="stat"><div class="stat-head"><span>⚡ 體力</span><b id="energyText">80</b></div><div class="bar"><div class="fill energy" id="energyBar"></div></div></div>
    </section>
    <section class="actions">
      <button class="action" data-action="feed"><span>🥣</span>餵食（2幣）</button>
      <button class="action" data-action="play"><span>🧶</span>玩耍</button>
      <button class="action" data-action="bath"><span>🛁</span>洗澡</button>
      <button class="action" data-action="sleep"><span>🌙</span>睡覺</button>
    </section>
    <section class="extra-actions">
      <button class="extra" id="gameBtn">🪙 接金幣小遊戲</button>
      <button class="extra guess" id="guessBtn">🎁 幸運猜猜</button>
      <button class="extra reaction" id="reactionBtn">⚡ 反應挑戰</button>
      <button class="extra shop" id="shopBtn">👗 服裝商店</button>
    </section>
    <p class="message" id="message">照顧麻糬，讓四個狀態保持健康吧！</p>
    <button class="reset" id="reset">重新開始遊戲</button>
  </main>
  <div class="modal" id="gameModal">
    <section class="panel">
      <button class="close" data-close="gameModal">×</button>
      <h2>🪙 接金幣</h2><p>15 秒內盡量點金幣，每點一次就得到 1 枚！</p>
      <div class="game-info"><span>時間：<b id="gameTime">15</b> 秒</span><span>得到：<b id="gameScore">0</b> 枚</span></div>
      <div class="game-area" id="gameArea"><button class="catch-coin" id="catchCoin">🪙</button></div>
    </section>
  </div>
  <div class="modal" id="guessModal">
    <section class="panel">
      <button class="close" data-close="guessModal">×</button>
      <h2>🎁 幸運猜猜</h2>
      <p>猜金幣藏在第幾個禮物盒。共玩 5 回合，猜中得到 3 枚金幣！</p>
      <div class="game-info"><span>回合：<b id="guessRound">1</b> / 5</span><span>得到：<b id="guessScore">0</b> 枚</span></div>
      <div class="choice-area" id="choiceArea">
        <button class="choice-btn" data-choice="1">🎁 1</button><button class="choice-btn" data-choice="2">🎁 2</button><button class="choice-btn" data-choice="3">🎁 3</button>
      </div>
      <p class="result-note" id="guessMessage">選一個禮物盒吧！</p>
    </section>
  </div>
  <div class="modal" id="reactionModal">
    <section class="panel">
      <button class="close" data-close="reactionModal">×</button>
      <h2>⚡ 反應挑戰</h2>
      <p>先按開始，等按鈕變綠色再立刻點它。太早按不算喔！</p>
      <div class="reaction-zone"><button class="reaction-btn" id="reactionTarget">開始</button></div>
      <p class="result-note" id="reactionMessage">準備好了嗎？</p>
    </section>
  </div>
  <div class="modal" id="shopModal">
    <section class="panel">
      <button class="close" data-close="shopModal">×</button>
      <h2>👗 麻糬服裝店</h2><p>用小遊戲賺到的金幣購買衣服，買過就能一直換穿。</p>
      <div class="shop-grid" id="shopGrid"></div>
    </section>
  </div>
  <script>
    const defaultState={food:80,mood:80,clean:80,energy:80,coins:20,exp:0,level:1,owned:['none'],outfit:'none'};
    let state=JSON.parse(localStorage.getItem('petGameState'))||{...defaultState};
    state.owned=Array.isArray(state.owned)?state.owned:['none'];state.outfit=state.outfit||'none';
    const clothes=[
      {id:'none',icon:'🐱',wear:'',name:'不戴飾品',price:0},
      {id:'pinkBow',icon:'🎀',wear:'🎀',filter:'none',name:'粉紅蝴蝶結',price:12},
      {id:'blueBow',icon:'🎀',wear:'🎀',filter:'hue-rotate(145deg)',name:'藍色蝴蝶結',price:18},
      {id:'purpleBow',icon:'🎀',wear:'🎀',filter:'hue-rotate(245deg)',name:'紫色蝴蝶結',price:22},
      {id:'cherryFlower',icon:'🌸',wear:'🌸',name:'櫻花',price:16},
      {id:'sunFlower',icon:'🌼',wear:'🌼',name:'黃色小花',price:20},
      {id:'redFlower',icon:'🌺',wear:'🌺',name:'紅色花朵',price:25}
    ];
    const pet=document.querySelector('#pet'),petWrap=document.querySelector('.pet-wrap'),message=document.querySelector('#message'),bubble=document.querySelector('#bubble'),outfit=document.querySelector('#outfit');
    function limit(number){return Math.max(0,Math.min(100,number))}
    function save(){localStorage.setItem('petGameState',JSON.stringify(state))}
    function currentClothes(){return clothes.find(item=>item.id===state.outfit)||clothes[0]}
    function update(){
      ['food','mood','clean','energy'].forEach(key=>{state[key]=limit(state[key]);document.querySelector(`#${key}Bar`).style.width=state[key]+'%';document.querySelector(`#${key}Text`).textContent=Math.round(state[key])});
      document.querySelector('#coins').textContent=state.coins;document.querySelector('#petName').textContent=`麻糬 Lv.${state.level}`;
      pet.textContent=state.energy<20?'😿':state.mood<25?'🙀':'🐱';
      const item=currentClothes();outfit.textContent=item.wear;outfit.style.filter=`${item.filter||'none'} drop-shadow(0 3px 2px #0002)`;
      petWrap.style.setProperty('--growth',Math.min(1.38,1+(state.level-1)*.055));save();
    }
    function talk(text){message.textContent=text;bubble.textContent=text;bubble.classList.add('show');pet.classList.remove('happy');void pet.offsetWidth;pet.classList.add('happy');setTimeout(()=>bubble.classList.remove('show'),1300)}
    function addExperience(amount){state.exp+=amount;let grew=false;while(state.exp>=state.level*40){state.exp-=state.level*40;state.level++;state.coins+=10;grew=true}if(grew)talk(`麻糬長大到 Lv.${state.level}，並得到 10 枚金幣！`)}
    function reward(){addExperience(10);if(Math.random()<.35)state.coins++}
    function finishGame(modalId,gameName,coins){addExperience(Math.max(5,coins*2));update();document.querySelector(`#${modalId}`).classList.remove('open');setTimeout(()=>alert(`${gameName}結束！\n你得到了 ${coins} 個金幣！`),100);talk(`你得到了 ${coins} 個金幣！`)}
    document.querySelector('.actions').addEventListener('click',event=>{const action=event.target.closest('.action')?.dataset.action;if(!action)return;if(action==='feed'){if(state.coins<2){talk('金幣不夠，玩小遊戲可以得到金幣！');return}state.coins-=2;state.food+=25;state.mood+=3;talk('好好吃，謝謝主人！')}if(action==='play'){if(state.energy<10){talk('我太累了，先讓我睡一下吧。');return}state.mood+=22;state.energy-=12;state.clean-=5;talk('毛線球最好玩了！');reward()}if(action==='bath'){state.clean+=30;state.mood-=3;talk('洗得香香的！')}if(action==='sleep'){state.energy+=35;state.food-=8;pet.classList.add('sleeping');talk('呼嚕……睡飽了！');setTimeout(()=>pet.classList.remove('sleeping'),1800)}update()});
    pet.addEventListener('click',()=>{state.mood+=5;talk('摸摸好舒服！');update()});

    /* 小遊戲一：接金幣 */
    const gameModal=document.querySelector('#gameModal'),gameArea=document.querySelector('#gameArea'),catchCoin=document.querySelector('#catchCoin');let gameTimer,timeLeft=15,gameScore=0,gameRunning=false;
    function moveCoin(){const maxX=Math.max(0,gameArea.clientWidth-catchCoin.offsetWidth),maxY=Math.max(0,gameArea.clientHeight-catchCoin.offsetHeight);catchCoin.style.left=Math.random()*maxX+'px';catchCoin.style.top=Math.random()*maxY+'px'}
    function stopGame(){if(!gameRunning)return;gameRunning=false;clearInterval(gameTimer);catchCoin.hidden=true;finishGame('gameModal','接金幣',gameScore)}
    function startGame(){clearInterval(gameTimer);gameModal.classList.add('open');catchCoin.hidden=false;gameRunning=true;timeLeft=15;gameScore=0;document.querySelector('#gameTime').textContent=timeLeft;document.querySelector('#gameScore').textContent=gameScore;requestAnimationFrame(moveCoin);gameTimer=setInterval(()=>{timeLeft--;document.querySelector('#gameTime').textContent=timeLeft;if(timeLeft<=0)stopGame()},1000)}
    catchCoin.addEventListener('click',()=>{if(!gameRunning)return;gameScore++;state.coins++;document.querySelector('#gameScore').textContent=gameScore;update();moveCoin()});
    document.querySelector('#gameBtn').addEventListener('click',startGame);

    /* 小遊戲二：幸運猜猜 */
    let guessRound=1,guessCoins=0,guessLocked=false;
    function startGuess(){guessRound=1;guessCoins=0;guessLocked=false;document.querySelector('#guessRound').textContent=guessRound;document.querySelector('#guessScore').textContent=guessCoins;document.querySelector('#guessMessage').textContent='選一個禮物盒吧！';document.querySelector('#guessModal').classList.add('open')}
    document.querySelector('#guessBtn').addEventListener('click',startGuess);
    document.querySelector('#choiceArea').addEventListener('click',event=>{const choice=Number(event.target.dataset.choice);if(!choice||guessLocked)return;guessLocked=true;const answer=Math.floor(Math.random()*3)+1;if(choice===answer){guessCoins+=3;state.coins+=3;document.querySelector('#guessMessage').textContent='猜中了！得到 3 枚金幣 🎉'}else{document.querySelector('#guessMessage').textContent=`沒猜中，金幣在第 ${answer} 個盒子`};document.querySelector('#guessScore').textContent=guessCoins;update();setTimeout(()=>{if(guessRound>=5){finishGame('guessModal','幸運猜猜',guessCoins)}else{guessRound++;guessLocked=false;document.querySelector('#guessRound').textContent=guessRound;document.querySelector('#guessMessage').textContent='下一回合，選一個禮物盒！'}},700)});

    /* 小遊戲三：反應挑戰 */
    const reactionTarget=document.querySelector('#reactionTarget'),reactionMessage=document.querySelector('#reactionMessage');let reactionState='idle',reactionWait,reactionStart=0;
    function resetReaction(){clearTimeout(reactionWait);reactionState='idle';reactionTarget.classList.remove('ready');reactionTarget.textContent='開始';reactionMessage.textContent='準備好了嗎？'}
    document.querySelector('#reactionBtn').addEventListener('click',()=>{resetReaction();document.querySelector('#reactionModal').classList.add('open')});
    reactionTarget.addEventListener('click',()=>{if(reactionState==='idle'){reactionState='waiting';reactionTarget.textContent='等綠燈…';reactionMessage.textContent='先不要按！';reactionWait=setTimeout(()=>{reactionState='ready';reactionStart=performance.now();reactionTarget.classList.add('ready');reactionTarget.textContent='現在按！';reactionMessage.textContent='快點！'},1500+Math.random()*2500);return}if(reactionState==='waiting'){clearTimeout(reactionWait);reactionState='idle';reactionTarget.textContent='再試一次';reactionMessage.textContent='按太早了！再點一次重新開始。';return}if(reactionState==='ready'){const ms=Math.round(performance.now()-reactionStart);const earned=ms<300?10:ms<450?7:ms<650?5:3;state.coins+=earned;reactionState='done';reactionTarget.classList.remove('ready');finishGame('reactionModal','反應挑戰',earned)}});

    /* 左耳飾品商店 */
    function renderShop(){const grid=document.querySelector('#shopGrid');grid.innerHTML=clothes.map(item=>{const owned=state.owned.includes(item.id),wearing=state.outfit===item.id;return `<article class="shop-item"><div class="shop-icon" style="filter:${item.filter||'none'}">${item.icon}</div><h3>${item.name}</h3><button data-clothes="${item.id}" ${wearing?'disabled':''}>${wearing?'佩戴中':owned?'戴上':`購買（${item.price}幣）`}</button></article>`}).join('')}
    document.querySelector('#shopBtn').addEventListener('click',()=>{renderShop();document.querySelector('#shopModal').classList.add('open')});
    document.querySelector('#shopGrid').addEventListener('click',event=>{const id=event.target.dataset.clothes;if(!id)return;const item=clothes.find(clothesItem=>clothesItem.id===id);if(!state.owned.includes(id)){if(state.coins<item.price){talk('金幣不夠，先去玩小遊戲吧！');return}state.coins-=item.price;state.owned.push(id);talk(`買到「${item.name}」了！`)}else{talk(`戴上「${item.name}」！`)}state.outfit=id;update();renderShop()});
    document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>{document.querySelector(`#${button.dataset.close}`).classList.remove('open');if(button.dataset.close==='gameModal'){gameRunning=false;clearInterval(gameTimer)}if(button.dataset.close==='reactionModal')resetReaction()}));
    document.querySelectorAll('.modal').forEach(modal=>modal.addEventListener('click',event=>{if(event.target===modal){modal.classList.remove('open');if(modal.id==='gameModal'){gameRunning=false;clearInterval(gameTimer)}if(modal.id==='reactionModal')resetReaction()}}));
    setInterval(()=>{state.food-=1.3;state.mood-=.8;state.clean-=.7;state.energy-=.6;if(Math.min(state.food,state.mood,state.clean,state.energy)<20)message.textContent='麻糬有一項狀態太低了，快照顧牠！';update()},5000);
    document.querySelector('#reset').addEventListener('click',()=>{if(confirm('確定要重新開始嗎？')){state={...defaultState,owned:['none']};update();talk('新的生活開始了！')}});update();
  </script>
</body>
</html>
